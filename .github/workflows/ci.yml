name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install detect-secrets==1.5.0

      - name: Pytest
        run: pytest -q

      - name: Reproduce benchmark
        run: |
          python scripts/reproduce_benchmark.py \
            --data data/sanitized/R9_SANITIZED_NON_RACE_ANALYTIC_DATA.csv \
            --output-dir reproduced

      - name: Numerical verification
        run: python scripts/verify_numeric.py --reproduced reproduced

      - name: Checksums
        run: python scripts/verify_checksums.py

      - name: Public-boundary audit
        run: python scripts/audit_public_tree.py

      - name: detect-secrets
        run: |
          detect-secrets scan --all-files --baseline .secrets.baseline \
            --exclude-files '\.venv/.*' \
            --exclude-files 'reproduced/.*' \
            --exclude-files 'release/SHA256SUMS\.txt' \
            --exclude-files 'release/PUBLIC_MANIFEST\.json' \
            --exclude-files 'figures/README\.md' \
            --exclude-files 'docs/README_VISUALS_MANIFEST\.md'

      - name: Whitespace / conflict markers
        run: |
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git diff --check
          else
            echo "Skipping git diff --check outside a Git work tree"
          fi
